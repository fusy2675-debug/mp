<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFF9E6"/><stop offset="100%" stop-color="#FFE0B2"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#6D4C41" flood-opacity="0.2"/></filter>
  </defs>
  <rect width="400" height="400" rx="36" fill="url(#bg)"/>
  <circle cx="58" cy="62" r="12" fill="#fff" opacity="0.3"/>
  <circle cx="342" cy="75" r="16" fill="#fff" opacity="0.25"/>
  <g filter="url(#shadow)" transform="translate(200,195)">
    <!-- pizza body -->
    <polygon points="0,-130 112,65 -112,65" fill="#F9A825"/>
    <!-- crust -->
    <path d="M-112 65 Q-120 90 -100 95 Q0 115 100 95 Q120 90 112 65 Z" fill="#E65100"/>
    <!-- sauce -->
    <polygon points="0,-110 95,55 -95,55" fill="#E53935" opacity="0.9"/>
    <!-- keju -->
    <polygon points="0,-90 78,45 -78,45" fill="#FFD54F" opacity="0.85"/>
    <!-- topping: pepperoni -->
    <circle cx="0" cy="-40" r="15" fill="#C62828"/>
    <circle cx="-38" cy="10" r="13" fill="#C62828"/>
    <circle cx="38" cy="10" r="13" fill="#C62828"/>
    <circle cx="0" cy="35" r="12" fill="#C62828"/>
    <!-- detail pepperoni -->
    <circle cx="0" cy="-40" r="8" fill="#B71C1C" opacity="0.5"/>
    <circle cx="-38" cy="10" r="7" fill="#B71C1C" opacity="0.5"/>
    <circle cx="38" cy="10" r="7" fill="#B71C1C" opacity="0.5"/>
    <!-- paprika -->
    <ellipse cx="-20" cy="-15" rx="8" ry="4" fill="#43A047" transform="rotate(-30 -20 -15)"/>
    <ellipse cx="22" cy="-20" rx="7" ry="3.5" fill="#E53935" transform="rotate(20 22 -20)"/>
    <ellipse cx="15" cy="25" rx="7" ry="3.5" fill="#66BB6A" transform="rotate(-10 15 25)"/>
    <!-- wajah -->
    <circle cx="-10" cy="-65" r="5" fill="#5D4037"/>
    <circle cx="10" cy="-65" r="5" fill="#5D4037"/>
    <path d="M-8 -57 Q0 -50 8 -57" stroke="#5D4037" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <text x="200" y="338" text-anchor="middle" font-family="'Nunito',sans-serif" font-size="22" font-weight="900" fill="#6D4C41">🍕 Pizza Pepperoni</text>
  <text x="200" y="360" text-anchor="middle" font-family="'Nunito',sans-serif" font-size="13" fill="#A1887F">Cheese Meleleh</text>
</svg>