<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFF9E6"/><stop offset="100%" stop-color="#FFE0B2"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#6D4C41" flood-opacity="0.2"/></filter>
  </defs>
  <rect width="400" height="400" rx="36" fill="url(#bg)"/>
  <circle cx="58" cy="62" r="12" fill="#fff" opacity="0.3"/>
  <circle cx="342" cy="75" r="16" fill="#fff" opacity="0.25"/>
  <g filter="url(#shadow)">
    <!-- bag -->
    <path d="M140 100 Q130 80 160 70 Q200 60 240 70 Q270 80 260 100 L275 280 Q275 310 200 315 Q125 310 125 280 Z" fill="#E53935"/>
    <!-- bag shine -->
    <path d="M155 95 Q148 80 165 72 Q185 65 200 68 Q185 70 175 80 Q165 90 165 100 Z" fill="#fff" opacity="0.2"/>
    <!-- bag label area -->
    <rect x="140" y="130" width="120" height="130" rx="12" fill="#FFF9E6"/>
    <!-- chips di dalam -->
    <ellipse cx="170" cy="175" rx="22" ry="12" fill="#FFA726" transform="rotate(-20 170 175)"/>
    <ellipse cx="200" cy="168" rx="24" ry="13" fill="#FFB74D" transform="rotate(10 200 168)"/>
    <ellipse cx="230" cy="175" rx="22" ry="12" fill="#FFA726" transform="rotate(25 230 175)"/>
    <ellipse cx="180" cy="200" rx="22" ry="12" fill="#FFB74D" transform="rotate(-15 180 200)"/>
    <ellipse cx="215" cy="198" rx="22" ry="12" fill="#FFA726" transform="rotate(20 215 198)"/>
    <!-- brand text -->
    <text x="200" y="240" text-anchor="middle" font-family="'Nunito',sans-serif" font-size="14" font-weight="900" fill="#E53935">CRISPYYY!</text>
    <!-- clip/seal -->
    <path d="M150 105 Q200 95 250 105" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- wajah lucu di bag -->
    <circle cx="186" cy="155" r="4.5" fill="#5D4037"/>
    <circle cx="214" cy="155" r="4.5" fill="#5D4037"/>
    <path d="M186 162 Q200 170 214 162" stroke="#5D4037" stroke-width="2" fill="none" stroke-linecap="round"/>
    <ellipse cx="174" cy="158" rx="7" ry="4" fill="#FF8A65" opacity="0.5"/>
    <ellipse cx="226" cy="158" rx="7" ry="4" fill="#FF8A65" opacity="0.5"/>
    <!-- chips terbang -->
    <ellipse cx="100" cy="190" rx="18" ry="10" fill="#FFA726" transform="rotate(-35 100 190)"/>
    <ellipse cx="300" cy="195" rx="18" ry="10" fill="#FFB74D" transform="rotate(40 300 195)"/>
    <ellipse cx="308" cy="155" rx="16" ry="9" fill="#FFA726" transform="rotate(-25 308 155)"/>
  </g>
  <text x="200" y="345" text-anchor="middle" font-family="'Nunito',sans-serif" font-size="22" font-weight="900" fill="#6D4C41">🥔 Potato Chips</text>
  <text x="200" y="367" text-anchor="middle" font-family="'Nunito',sans-serif" font-size="13" fill="#A1887F">Truffle Flavor</text>
</svg>