<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>daisyfumarket — Seed Data to Firebase</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      background-color: #FDFBF7;
      background-image: radial-gradient(rgba(242, 107, 87, .12) 1.6px, transparent 1.7px), radial-gradient(rgba(245, 184, 65, .15) 1.6px, transparent 1.7px);
      background-size: 26px 26px, 26px 26px;
      background-position: 0 0, 13px 13px;
      color: #583C32;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #FFFFFF;
      border-radius: 28px;
      padding: 36px;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 18px 45px -18px rgba(88, 60, 50, .35);
    }
    h1 {
      font-family: 'Quicksand', 'Nunito', sans-serif;
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
      color: #3E2C26;
    }
    .sub { font-size: 13px; color: #8D6E63; font-weight: 600; margin-bottom: 24px; }
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #FF9B85 0%, #F26B57 100%);
      color: #fff;
      font-weight: 800;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 9999px;
      box-shadow: 0 4px 12px -4px rgba(242, 107, 87, .5);
    }
    #log {
      background: #FFF9E6;
      border-radius: 18px;
      padding: 16px;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 12px;
      line-height: 1.7;
      max-height: 380px;
      overflow-y: auto;
      margin: 20px 0;
      border: 2px dashed #FBE7B2;
      color: #583C32;
    }
    #log .ok { color: #5F8562; font-weight: 700; }
    #log .err { color: #E14E3B; font-weight: 700; }
    #log .info { color: #F26B57; font-weight: 700; }
    #log .warn { color: #D9822B; font-weight: 700; }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 18px;
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    #btn-seed {
      background: linear-gradient(135deg, #FF9B85 0%, #F26B57 100%);
      color: #fff;
      box-shadow: 0 10px 22px -8px rgba(225, 78, 59, .55);
    }
    #btn-seed:hover { transform: translateY(-2px); filter: brightness(1.03); }
    #btn-seed:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    #btn-clear {
      background: #FFF9E6;
      color: #E14E3B;
      border: 2px solid #FBE7B2;
      margin-top: 10px;
    }
    #btn-clear:hover { background: #FFF1CE; transform: translateY(-1px); }
    #btn-clear:disabled { opacity: 0.5; cursor: not-allowed; }
    .stats { display: flex; gap: 12px; margin-top: 16px; }
    .stat {
      flex: 1;
      background: #FFF9E6;
      border-radius: 18px;
      padding: 14px;
      text-align: center;
      border: 1px solid #FBE7B2;
    }
    .stat-num { font-size: 28px; font-weight: 900; color: #F26B57; font-family: 'Quicksand', sans-serif; }
    .stat-label { font-size: 11px; font-weight: 700; color: #8D6E63; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="card">
    <h1 style="display:flex;align-items:center;gap:10px;"><img src="favicon.svg" alt="logo" style="width:28px;height:28px;border-radius:6px;" />daisyfumarket <span class="badge">Seed Tool</span></h1>
    <p class="sub">Masukkan data produk & transaksi langsung ke Firebase Firestore</p>
    <div id="log"></div>
    <div class="stats" id="stats" style="display:none">
      <div class="stat"><div class="stat-num" id="stat-products">0</div><div class="stat-label">Produk</div></div>
      <div class="stat"><div class="stat-num" id="stat-transactions">0</div><div class="stat-label">Transaksi</div></div>
    </div>
    <button id="btn-seed" onclick="seedData()">Seed Data ke Firestore</button>
    <button id="btn-clear" onclick="clearData()">Hapus Semua Data</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCizKUeVCy_3Wr9YQkw9B7xQ2GPyjN8H-I",
      authDomain: "kasir-syfu.firebaseapp.com",
      projectId: "kasir-syfu",
      storageBucket: "kasir-syfu.firebasestorage.app",
      messagingSenderId: "399419573703",
      appId: "1:399419573703:web:c3764021249482cbfdc5e2"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const logEl = document.getElementById('log');
    function log(msg, cls = 'info') {
      logEl.innerHTML += '<div class="' + cls + '">' + msg + '</div>';
      logEl.scrollTop = logEl.scrollHeight;
    }

    /**
 * Seed data produk & transaksi ke Firebase Firestore menggunakan Admin SDK
 * 
 * CARA PAKAI:
 * 1. Download Service Account Key dari Firebase Console:
 *    Project Settings → Service Accounts → Generate New Private Key
 *    Simpan sebagai `service-account.json` di folder ini.
 * 
 * 2. Install dependency:
 *    npm install firebase-admin
 * 
 * 3. Jalankan:
 *    node seed-firebase.js
 */

const admin = require('firebase-admin');
const fs = require('fs');
const path = require('path');

// ==========================================
// KONFIGURASI
// ==========================================
const SERVICE_ACCOUNT_PATH = path.join(__dirname, 'service-account.json');

// Data produk (sama persis dengan app.js / seed.html)

    async function seedData() {
      const btn = document.getElementById('btn-seed');
      btn.disabled = true;
      btn.textContent = 'Sedang mengirim...';
      log('Mulai seed data ke Firestore...', 'info');

      try {
        let count = 0;

        for (const p of PRODUCTS) {
          await db.collection('products').doc(p.id).set(p);
          count++;
          log('[OK] Produk ' + count + '/' + PRODUCTS.length + ': ' + p.name, 'ok');
        }
        log('Semua ' + PRODUCTS.length + ' produk berhasil di-seed!', 'ok');

        for (const t of TRANSACTIONS) {
          await db.collection('transactions').doc(t.id).set(t);
          count++;
          log('[OK] Transaksi: ' + t.id + ' — ' + t.customerName, 'ok');
        }
        log('Semua ' + TRANSACTIONS.length + ' transaksi berhasil di-seed!', 'ok');

        document.getElementById('stat-products').textContent = PRODUCTS.length;
        document.getElementById('stat-transactions').textContent = TRANSACTIONS.length;
        document.getElementById('stats').style.display = 'flex';

        log('SEED SELESAI! Total ' + count + ' dokumen dikirim ke Firestore.', 'ok');
      } catch (err) {
        log('ERROR: ' + err.message, 'err');
        log('Pastikan Firestore Rules mengizinkan write tanpa auth, atau Firebase Auth sudah aktif.', 'warn');
      }

      btn.disabled = false;
      btn.textContent = 'Seed Data ke Firestore';
    }

    async function clearData() {
      if (!confirm('Hapus SEMUA data produk & transaksi dari Firestore?')) return;
      const btn = document.getElementById('btn-clear');
      btn.disabled = true;
      log('Menghapus data...', 'warn');

      try {
        const prods = await db.collection('products').get();
        for (const doc of prods.docs) {
          await doc.ref.delete();
          log('[DEL] Produk: ' + doc.id, 'err');
        }
        const trxs = await db.collection('transactions').get();
        for (const doc of trxs.docs) {
          await doc.ref.delete();
          log('[DEL] Transaksi: ' + doc.id, 'err');
        }
        const carts = await db.collection('carts').get();
        for (const doc of carts.docs) {
          await doc.ref.delete();
          log('[DEL] Cart: ' + doc.id, 'err');
        }
        log('Semua data berhasil dihapus!', 'warn');
      } catch (err) {
        log('ERROR: ' + err.message, 'err');
      }

      btn.disabled = false;
    }
  </script>
</body>
</html>
