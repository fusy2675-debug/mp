    async function seedData() {
      const btn = document.getElementById('btn-seed');
      btn.disabled = true;
      btn.textContent = 'Sedang mengirim...';
      log('Mulai seed data ke Firestore...', 'info');

      try {
        let count = 0;

        for (const p of PRODUCTS) {
          await db.collection('products').doc(p.id).set(p);
          count++;
          log('[OK] Produk ' + count + '/' + PRODUCTS.length + ': ' + p.name, 'ok');
        }
        log('Semua ' + PRODUCTS.length + ' produk berhasil di-seed!', 'ok');

        for (const t of TRANSACTIONS) {
          await db.collection('transactions').doc(t.id).set(t);
          count++;
          log('[OK] Transaksi: ' + t.id + ' — ' + t.customerName, 'ok');
        }
        log('Semua ' + TRANSACTIONS.length + ' transaksi berhasil di-seed!', 'ok');

        document.getElementById('stat-products').textContent = PRODUCTS.length;
        document.getElementById('stat-transactions').textContent = TRANSACTIONS.length;
        document.getElementById('stats').style.display = 'flex';

        log('SEED SELESAI! Total ' + count + ' dokumen dikirim ke Firestore.', 'ok');
      } catch (err) {
        log('ERROR: ' + err.message, 'err');
        log('Pastikan Firestore Rules mengizinkan write tanpa auth, atau Firebase Auth sudah aktif.', 'warn');
      }

      btn.disabled = false;
      btn.textContent = 'Seed Data ke Firestore';
    }

    async function clearData() {
      if (!confirm('Hapus SEMUA data produk & transaksi dari Firestore?')) return;
      const btn = document.getElementById('btn-clear');
      btn.disabled = true;
      log('Menghapus data...', 'warn');

      try {
        const prods = await db.collection('products').get();
        for (const doc of prods.docs) {
          await doc.ref.delete();
          log('[DEL] Produk: ' + doc.id, 'err');
        }
        const trxs = await db.collection('transactions').get();
        for (const doc of trxs.docs) {
          await doc.ref.delete();
          log('[DEL] Transaksi: ' + doc.id, 'err');
        }
        const carts = await db.collection('carts').get();
        for (const doc of carts.docs) {
          await doc.ref.delete();
          log('[DEL] Cart: ' + doc.id, 'err');
        }
        log('Semua data berhasil dihapus!', 'warn');
      } catch (err) {
        log('ERROR: ' + err.message, 'err');
      }

      btn.disabled = false;
    }
